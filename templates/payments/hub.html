{% extends "layout.html" %}
{% block content %}
<div style="display:flex;flex-direction:column;min-height:calc(100vh - 170px);">
  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--mo-border);margin-bottom:4px;">
    <div style="display:flex;gap:4px;">
      <a class="mo-subtab {{ 'mo-subtab-active' if group == 'fulfillment' else '' }}" href="{{ url_for('payments.hub', group='fulfillment') }}">Fulfillment</a>
      <a class="mo-subtab {{ 'mo-subtab-active' if group == 'logistics' else '' }}" href="{{ url_for('payments.hub', group='logistics') }}">Logistics</a>
    </div>
  </div>
  <p style="font-size:13.5px;color:var(--mo-muted);margin:14px 0 0;">
    {{ 'Fulfillment' if group == 'fulfillment' else 'Logistics' }} payment operations — pick a workstream to continue.
  </p>
  <div class="kb-grid">
    {% for card in cards %}
      <a class="kb-pcard" style="--kb-c1:#3b82f6;--kb-c2:#2563eb;" href="{{ url_for('payments.open_card', card_id=card.id) }}">
        <span class="kb-medallion" style="--kb-c1:#3b82f6;--kb-c2:#2563eb;">{{ card.title[:2]|upper }}</span>
        <span class="kb-pcard-title kb-pcard-title-big">{{ card.title }}</span>
      </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
